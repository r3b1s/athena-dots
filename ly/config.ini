# ly — user config, merged over /etc/ly/config.ini by install.sh.
# Colours are the pinkrot theme; the format is 0xAARRGGBB.
# This VM has no other session, so i3 (from /usr/share/xsessions) is what the
# session list will offer. No autologin here: log in interactively.

bg = 0x00050007
fg = 0x00f17e97
border_fg = 0x00d40d40
error_bg = 0x00050007
error_fg = 0x00f00f40
cmatrix_fg = 0x00d40d40
bigclock = none

# The guest keyboard has no hardware numlock state to inherit.
numlock = true

# Leave the version string and key hints alone: they are useful when a session
# fails to start, which is the first thing that goes wrong in a VM.
hide_version_string = false
hide_key_hints = false
