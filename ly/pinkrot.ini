# pinkrot overlay for ly, merged into /etc/ly/config.ini by install.sh.
#
# NOT a standalone config: ly reads exactly one file, /etc/ly/config.ini
# (a compile-time path in its source), with no per-user fallback. So this is a set
# of keys to substitute into the packaged file; everything not listed here keeps
# the packaged value.
#
# Values are 0xAARRGGBB. Only keys ly 1.4.1 actually parses are listed; anything
# else is silently ignored, which is how an earlier version of this file failed
# to apply without saying so.
#
#   bg #050007  fg #f17e97  accent #D40D40  bright #F00F40

bg = 0x00050007
fg = 0x00f17e97
border_fg = 0x00d40d40

error_bg = 0x00050007
error_fg = 0x00f00f40

# The animated background ly shows behind the box.
cmatrix_fg = 0x00d40d40
cmatrix_head_col = 0x00f00f40
gameoflife_fg = 0x00d40d40

# Doom fire gradient, unused unless animation is turned on, kept consistent.
doom_top_color = 0x00d40d40
doom_middle_color = 0x00f00f40
doom_bottom_color = 0x00050007

# The guest keyboard has no hardware numlock state to inherit.
numlock = true
