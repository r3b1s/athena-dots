# Safe sshd defaults (TODO.md). Installed to /etc/ssh/sshd_config.d/ by
# install.sh; sshd stays DISABLED — this only hardens the config for the day
# it is ever enabled. Arch reads sshd_config.d/*.conf after the main file, so
# these override the commented defaults there.
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
