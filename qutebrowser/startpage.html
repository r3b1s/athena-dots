<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>start</title>
<!-- Nothing but the desktop background. bin/x11-wallpaper keeps the current
     feh image pointed at by ../wallpapers/current (i.e. ~/.config/wallpapers,
     which install.sh seeds); feh's own ~/.fehbg is a shell script, not
     something a browser can render, so it cannot be used here. -->
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #050007 url("../wallpapers/current") center center / cover no-repeat fixed;
  }
</style>
</head>
<body></body>
</html>
