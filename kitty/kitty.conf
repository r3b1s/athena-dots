# kitty. Colours (pinkrot, ported from alacritty) are in pinkrot.conf.
include pinkrot.conf

font_family      JetBrainsMono Nerd Font
font_size        9.0
window_padding_width 14
confirm_os_window_close 0
enable_audio_bell no

# Lets bin/x11-terminal-here ask the focused kitty for its working directory.
# `socket-only` keeps shells inside kitty from controlling it.
allow_remote_control socket-only
listen_on unix:@kitty-{kitty_pid}

# Carried over from alacritty.
map shift+insert paste_from_clipboard
map ctrl+insert  copy_to_clipboard
map shift+enter  send_text all \x1b\r
