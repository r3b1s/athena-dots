# The i3bar, fed by i3status-rust. Its blocks and theme live in
# ../../i3status-rust/ (linked to ~/.config/i3status-rust/ by install.sh).
#
# i3bar also hosts the system tray (nm-applet) natively; that is separate from
# status_command, which is why i3status-rs does not have to be the only thing
# on the bar.
#
# `bar` blocks cannot be split across includes, so the bar colours (pinkrot)
# are declared here rather than in 01-pinkrot.conf.

bar {
    position top
    status_command i3status-rs ~/.config/i3status-rust/config.toml

    colors {
        background #050007
        statusline #f17e97
        separator  #3a1420

        #class              #border  #backgr  #text
        focused_workspace   #D40D40  #D40D40  #050007
        active_workspace    #8F0936  #8F0936  #f17e97
        inactive_workspace  #050007  #050007  #a85869
        urgent_workspace    #F00F40  #F00F40  #050007
        binding_mode        #8F0936  #8F0936  #f17e97
    }
}
