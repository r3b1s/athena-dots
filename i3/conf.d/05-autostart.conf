# Autostart. i3 does not run /etc/xdg/autostart, so anything that normally
# relies on an XDG autostart entry (spice-vdagent, nm-applet…) is started here.

# Tiling behaviour: pick split direction from the focused window's shape.
exec_always --no-startup-id autotiling

# Notifications.
exec --no-startup-id dunst

# Polkit authentication agent (pkexec / virt-manager-style prompts).
exec --no-startup-id /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# NetworkManager tray applet (shows in the i3bar tray).
exec --no-startup-id nm-applet

# SPICE guest agent: shared clipboard and automatic display resize.
# The system half is spice-vdagentd.service (enabled by install.sh).
exec --no-startup-id spice-vdagent

exec --no-startup-id numlockx on

# Monitor: pin the resolution. A headless VM in SPICE comes up at whatever size
# the last client asked for, so without this the desktop can be any size. Runs
# before the wallpaper so the fill covers the final geometry.
exec_always --no-startup-id $bin/x11-monitor 1920x1080

# Wallpaper: a random image from ~/.config/wallpapers, which is yours to fill
# (this repo does not ship one). exec_always means a reload picks a new one, so
# $mod+Shift+r (i3-msg reload) reshuffles it.
exec_always --no-startup-id $bin/x11-wallpaper
