# Application launching. qutebrowser is the main browser.
#
# A named workspace (x11-ws-app) toggles to the app's workspace and launches it
# if that workspace is empty; the direct bind always opens a new window.

# Browser workspace.
bindsym $mod+u exec --no-startup-id $bin/x11-ws-app browser1 qutebrowser
bindsym $mod+Shift+Ctrl+u move container to workspace browser1

# Direct launches.
bindsym $mod+b exec --no-startup-id qutebrowser

# ── window routing ────────────────────────────────────────────────────────
# `assign` pins every window of a matching app to a workspace, whichever
# workspace it was launched from. Syntax:
#   assign [class="(?i)appname"] <workspace>
# Find the class of a running window with `xprop WM_CLASS` (click the window).
